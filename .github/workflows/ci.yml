name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: meridian-pay-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t meridian-pay-pipeline:${{ github.sha }} .

      - name: Save Docker image
        run: docker save meridian-pay-pipeline:${{ github.sha }} -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meridian-pay-pipeline:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  sbom:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: meridian-pay-pipeline:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          upload-artifact-retention: 30

  push:
    runs-on: ubuntu-latest
    needs: [scan, sbom]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Set lowercase image reference
        id: image
        run: |
          echo "ref=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ steps.image.outputs.ref }}:${{ github.sha }}

      - name: Push image to GHCR
        id: push
        run: |
          docker push ${{ steps.image.outputs.ref }}:${{ github.sha }}
          digest=$(docker image inspect ${{ steps.image.outputs.ref }}:${{ github.sha }} --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        run: cosign sign --yes ${{ steps.image.outputs.ref }}@${{ steps.push.outputs.digest }}

      - name: Verify Cosign signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.ref }}@${{ steps.push.outputs.digest }}

  summary:
    runs-on: ubuntu-latest
    needs: [test, docker, scan, sbom, push]
    if: always()
    steps:
      - name: Generate pipeline summary
        run: |
          declare -A results=(
            ["Test"]="${{ needs.test.result }}"
            ["Docker Build"]="${{ needs.docker.result }}"
            ["Trivy Scan"]="${{ needs.scan.result }}"
            ["SBOM (Syft)"]="${{ needs.sbom.result }}"
            ["Sign & Push"]="${{ needs.push.result }}"
          )

          {
            echo "## Pipeline Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            for stage in "Test" "Docker Build" "Trivy Scan" "SBOM (Syft)" "Sign & Push"; do
              result="${results[$stage]}"
              case "$result" in
                success) status="✅ Passed" ;;
                failure) status="❌ Failed" ;;
                skipped) status="⏭️ Skipped" ;;
                cancelled) status="🚫 Cancelled" ;;
                *) status="❓ Unknown ($result)" ;;
              esac
              echo "| $stage | $status |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
